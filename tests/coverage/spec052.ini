# Coverage of spec 052's new modules, enforced at 90% (constitution II; tasks T037, T062a, T079a).
# Used by `make coverage-052` (unit tests) and `make isolation-coverage` (the isolation suite,
# server run under coverage). `source` in [run] makes a module no test imports report as 0%,
# instead of vanishing from the report. sigterm = True: the server is stopped with SIGTERM, and
# without it the data is lost.
[run]
branch = True
sigterm = True
data_file = build/.coverage-052
source = src/iris_pgwire

[report]
fail_under = 90
show_missing = True
include =
    src/iris_pgwire/transaction_status.py
    src/iris_pgwire/savepoints.py
    src/iris_pgwire/_savepoint_mixin.py
    src/iris_pgwire/compat_mode.py
    src/iris_pgwire/_locking_mixin.py
    src/iris_pgwire/sql_translator/locking_clauses.py
    src/iris_pgwire/sql_translator/on_conflict.py
    src/iris_pgwire/sql_translator/timeouts.py
    src/iris_pgwire/_timeout_mixin.py
